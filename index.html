<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="FoodTrack helps hostel and canteen teams track food inventory, expiry dates and waste.">
  <title>FoodTrack — Expiry &amp; Waste Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- LOGIN -->
<div id="login-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div class="card" style="width:100%;max-width:380px;text-align:center">
    <div style="font-size:40px;margin-bottom:8px">🌿</div>
    <h1 style="font-size:22px;font-weight:700;color:#14532d;margin:0 0 4px">FoodTrack</h1>
    <p style="color:var(--tx2);font-size:14px;margin:0 0 24px">Hostel Food Expiry & Waste Manager</p>
    <div style="text-align:left;display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="font-size:13px;font-weight:600;color:var(--tx2);display:block;margin-bottom:6px">Email</label>
        <input id="l-email" type="email" value="admin@mess.edu" placeholder="email@college.edu">
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:var(--tx2);display:block;margin-bottom:6px">Password</label>
        <input id="l-pass" type="password" value="hostel123" placeholder="••••••••">
      </div>
      <button class="btn-primary" style="width:100%;padding:11px" onclick="doLogin()">Sign In</button>
      <p style="font-size:12px;color:var(--tx2);text-align:center;margin:0">Default: admin@mess.edu / hostel123</p>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" style="display:none">
  <nav class="sidebar" id="sidebar">
    <div style="padding:20px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1)">
      <div style="font-size:22px">🌿</div>
      <div style="font-size:15px;font-weight:700;color:#fff;margin-top:4px">FoodTrack</div>
      <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px" id="user-label"></div>
    </div>
    <div style="flex:1;padding:12px 0">
      <a onclick="nav('dashboard')" id="nav-dashboard">📊 Dashboard</a>
      <a onclick="nav('inventory')" id="nav-inventory">🥦 Inventory</a>
      <a onclick="nav('wastelog')" id="nav-wastelog">🗑️ Waste Log</a>
      <a onclick="nav('reports')" id="nav-reports">📈 Reports</a>
      <a onclick="nav('donation')" id="nav-donation">🤝 Donate</a>
    </div>
    <div style="padding:12px 10px;border-top:1px solid rgba(255,255,255,.1)">
      <a onclick="doLogout()" style="color:rgba(255,165,0,.8)">🔓 Logout</a>
    </div>
  </nav>
  <main class="main">
    <div id="page"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" style="display:none" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast"></div>

  <!-- Application scripts are loaded in dependency order. -->
  <script src="js/core.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/waste-log.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/donation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
